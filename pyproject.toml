[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxstudy"
version = "0.1.0"
description = "Local video-audio transcription and Obsidian study guides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
voxstudy = "voxstudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
